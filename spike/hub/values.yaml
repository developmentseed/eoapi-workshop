# z2jh front door for the participant stack (option 3). Install: spike/hub/deploy.sh.
# Chart jupyterhub 4.4.2 (JupyterHub 5.5.2). The pod per participant is the same as
# spike/chart: the Lab is the singleuser container, the DB a native sidecar, the rest
# extraContainers. Every service is served at /user/{username}/<prefix>/, so each root
# path carries that prefix (spike/hub/jupyter_server_config.py).
#
# KubeSpawner renders every string here with str.format: {username} is the user, and a
# literal brace must be doubled ({{ }}), e.g. in the JSON env values below.
# Images: a fixed tag, never :latest. The pre-puller sets no imagePullPolicy, so a
# :latest image defaults to Always and a kind-loaded image fails to pull.

hub:
  config:
    Authenticator:
      allowed_users: [u01, u02]
  services:
    spike-admin: {}  # API token generated into Secret `hub` (hub.services.spike-admin.apiToken)
  loadRoles:
    spike-admin:
      services: [spike-admin]
      scopes: [admin:users, admin:servers]  # pre-spawn; no access:servers (cannot open a Lab)
  extraVolumes:
    - {name: passwords, secret: {secretName: participant-passwords}}
  extraVolumeMounts:
    - {name: passwords, mountPath: /etc/participant-passwords, readOnly: true}
  extraConfig:
    10-passwords: |
      # One password per user, from Secret participant-passwords (key = username).
      # Not SharedPassword/Dummy: with those anyone can log in as anyone.
      from hmac import compare_digest
      from pathlib import Path
      from jupyterhub.auth import Authenticator

      class SecretPasswords(Authenticator):
          async def authenticate(self, handler, data):
              keys = {p.name: p for p in Path("/etc/participant-passwords").iterdir() if not p.name.startswith(".")}
              key = keys.get(data["username"])
              if key and compare_digest(key.read_text().strip().encode(), data["password"].encode()):
                  return data["username"]

      c.JupyterHub.authenticator_class = SecretPasswords
    20-db-password: |
      # A fresh random DB password per pod (the DB is an emptyDir, so per spawn).
      import secrets

      def db_password(spawner, pod):
          pw = secrets.token_urlsafe(24)
          for ctr in (pod.spec.init_containers or []) + pod.spec.containers:
              for e in ctr.env or []:  # V1EnvVar (Lab) or dict (init/extra containers)
                  if getattr(e, "value", None) == "generated-per-pod":
                      e.value = pw
                  elif isinstance(e, dict) and e.get("value") == "generated-per-pod":
                      e["value"] = pw
          return pod

      c.KubeSpawner.modify_pod_hook = db_password

proxy:
  service: {type: ClusterIP}  # reached through the Ingress; no cloud LoadBalancer

ingress:
  enabled: true
  ingressClassName: nginx
  hosts: [hub.spike.local]
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

scheduling:  # every one of these creates a cluster-scoped object
  userScheduler: {enabled: false}
  podPriority: {enabled: false}
  userPlaceholder: {enabled: false}

cull: {enabled: false}  # pre-spawned the day before; nobody gets culled

singleuser:
  image: {name: eoapi-spike-hub-lab, tag: spike, pullPolicy: IfNotPresent}
  cmd: jupyterhub-singleuser
  storage:
    type: none  # like spike/chart: the home is the container's layer
    extraVolumes:
      - {name: pgdata, emptyDir: {}}
  # The iptables init container needs NET_ADMIN (not allowed by Pod Security
  # "baseline"); the default NetworkPolicy already denies egress to 169.254.169.254.
  cloudMetadata: {blockWithIptables: false}
  cpu: {guarantee: 0.25}
  memory: {guarantee: 1G, limit: 3G}
  # Mounted into the Lab by z2jh, and into the containers below through the
  # chart's internal volume `files` (subPath = key). Contents: deploy.sh --set-file.
  extraFiles:
    workshop_filters: {mountPath: /etc/eoapi/workshop_filters.py}
    stac_browser_conf: {mountPath: /etc/eoapi/stac-browser.conf.template}
  extraEnv:
    PGHOST: localhost
    PGPORT: "5432"
    PGUSER: eoapi
    PGDATABASE: postgis
    PGPASSWORD: generated-per-pod
    WORKSHOP_USER: "{username}"
    STAC_API_ENDPOINT: http://localhost:8084/user/{username}/stac
    TITILER_PGSTAC_API_ENDPOINT: http://localhost:8082/user/{username}/raster
    TIPG_API_ENDPOINT: http://localhost:8083/user/{username}/vector
    MOCK_OIDC_ENDPOINT: http://localhost:8085/user/{username}/oidc
    STAC_API_BROWSER_URL: http://hub.spike.local:18080/user/{username}/stac
    TITILER_BROWSER_URL: http://hub.spike.local:18080/user/{username}/raster
    TIPG_BROWSER_URL: http://hub.spike.local:18080/user/{username}/vector
    STAC_BROWSER_URL: http://hub.spike.local:18080/user/{username}/browser
    MOCK_OIDC_BROWSER_URL: http://hub.spike.local:18080/user/{username}/oidc
    STAC_MANAGER_URL: http://hub.spike.local:18080/user/{username}/manager

  initContainers:
    - name: database
      image: eoapi-spike-db:spike
      imagePullPolicy: IfNotPresent
      restartPolicy: Always  # native sidecar: up (startupProbe) before the rest
      args: [postgres, -N, "100", -c, listen_addresses=127.0.0.1]
      volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
      startupProbe:
        exec: {command: [pg_isready, -h, 127.0.0.1, -U, eoapi, -d, postgis]}
        periodSeconds: 2
        failureThreshold: 150
      resources: {requests: {cpu: 60m, memory: 560Mi}, limits: {memory: 960Mi}}
      env:
        - {name: POSTGRES_USER, value: eoapi}
        - {name: POSTGRES_DB, value: postgis}
        - {name: PGUSER, value: eoapi}
        - {name: PGDATABASE, value: postgis}
        - {name: POSTGRES_PASSWORD, value: generated-per-pod}
        - {name: PGPASSWORD, value: generated-per-pod}

  extraContainers:
    - name: stac-fastapi
      image: ghcr.io/stac-utils/stac-fastapi-pgstac:7.0.0
      args: [uvicorn, stac_fastapi.pgstac.app:create_app, --factory, --host, 127.0.0.1, --port, "8081", --workers, "1", --root-path, "/user/{username}/stac"]
      resources: {requests: {cpu: 30m, memory: 176Mi}, limits: {memory: 320Mi}}
      env:
        - {name: PGHOST, value: localhost}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: eoapi}
        - {name: PGDATABASE, value: postgis}
        - {name: PGPASSWORD, value: generated-per-pod}
        - {name: DB_MIN_CONN_SIZE, value: "1"}
        - {name: DB_MAX_CONN_SIZE, value: "1"}
        - {name: ENABLE_TRANSACTIONS_EXTENSIONS, value: "1"}
        - {name: FORWARDED_ALLOW_IPS, value: "*"}

    - name: mock-oidc
      image: ghcr.io/alukach/mock-oidc-server@sha256:5972adac0b6e3a094ea043be0f1851c65e3fd54e17a546f0b71dedd17c7a2d6a
      args: [/app/.venv/bin/uvicorn, app:app, --host, 127.0.0.1, --port, "8085", --workers, "1"]
      resources: {requests: {cpu: 10m, memory: 80Mi}, limits: {memory: 128Mi}}
      env:
        - {name: ISSUER, value: "http://hub.spike.local:18080/user/{username}/oidc"}
        - {name: PORT, value: "8085"}
        - {name: SCOPES, value: "stac:read,stac:write"}
        - {name: FORWARDED_ALLOW_IPS, value: "*"}

    - name: stac-auth-proxy
      image: ghcr.io/developmentseed/stac-auth-proxy:v1.2.0
      args: [uvicorn, stac_auth_proxy.app:create_app, --factory, --host, 127.0.0.1, --port, "8084"]
      volumeMounts: [{name: files, mountPath: /app/src/workshop_filters.py, subPath: workshop_filters}]
      resources: {requests: {cpu: 50m, memory: 224Mi}, limits: {memory: 384Mi}}
      env:
        - {name: PORT, value: "8084"}
        - {name: ROOT_PATH, value: "/user/{username}/stac"}
        - {name: UPSTREAM_URL, value: "http://localhost:8081"}
        - {name: OIDC_DISCOVERY_URL, value: "http://hub.spike.local:18080/user/{username}/oidc/.well-known/openid-configuration"}
        - {name: OIDC_DISCOVERY_INTERNAL_URL, value: "http://localhost:8085/user/{username}/oidc/.well-known/openid-configuration"}
        - {name: DEFAULT_PUBLIC, value: "true"}
        - {name: WAIT_FOR_UPSTREAM, value: "true"}
        - {name: FORWARDED_ALLOW_IPS, value: "*"}
        - name: PRIVATE_ENDPOINTS
          value: >-
            {{"^/collections$":[["POST","stac:write"]],
            "^/collections/([^/]+)$":[["PUT","stac:write"],["PATCH","stac:write"],["DELETE","stac:write"]],
            "^/collections/([^/]+)/items$":[["POST","stac:write"]],
            "^/collections/([^/]+)/items/([^/]+)$":[["PUT","stac:write"],["PATCH","stac:write"],["DELETE","stac:write"]],
            "^/collections/([^/]+)/bulk_items$":[["POST","stac:write"]]}}
        - {name: ITEMS_FILTER_CLS, value: "workshop_filters:TenantFilter"}
        - {name: ITEMS_FILTER_KWARGS, value: '{{"field":"collection"}}'}
        - {name: COLLECTIONS_FILTER_CLS, value: "workshop_filters:TenantFilter"}
        - {name: COLLECTIONS_FILTER_KWARGS, value: '{{"field":"id"}}'}

    - name: titiler-pgstac
      image: ghcr.io/stac-utils/titiler-pgstac:3.2.0
      args: [uvicorn, titiler.pgstac.main:app, --host, 127.0.0.1, --port, "8082", --workers, "1"]
      resources: {requests: {cpu: 140m, memory: 464Mi}, limits: {memory: 768Mi}}
      env:
        - {name: PGHOST, value: localhost}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: eoapi}
        - {name: PGDATABASE, value: postgis}
        - {name: PGPASSWORD, value: generated-per-pod}
        - {name: DB_MIN_CONN_SIZE, value: "1"}
        - {name: DB_MAX_CONN_SIZE, value: "10"}
        - {name: TITILER_PGSTAC_API_ROOT_PATH, value: "/user/{username}/raster"}
        - {name: FORWARDED_ALLOW_IPS, value: "*"}
        - {name: CPL_TMPDIR, value: /tmp}
        - {name: GDAL_CACHEMAX, value: "200"}
        - {name: GDAL_DISABLE_READDIR_ON_OPEN, value: EMPTY_DIR}
        - {name: GDAL_INGESTED_BYTES_AT_OPEN, value: "32768"}
        - {name: GDAL_HTTP_MERGE_CONSECUTIVE_RANGES, value: "YES"}
        - {name: GDAL_HTTP_MULTIPLEX, value: "YES"}
        - {name: GDAL_HTTP_VERSION, value: "2"}
        - {name: PYTHONWARNINGS, value: ignore}
        - {name: VSI_CACHE, value: "TRUE"}
        - {name: VSI_CACHE_SIZE, value: "5000000"}
        - {name: MOSAIC_CONCURRENCY, value: "1"}
        - {name: TITILER_PGSTAC_API_ENABLE_EXTERNAL_DATASET_ENDPOINTS, value: "True"}
        - {name: AWS_NO_SIGN_REQUEST, value: "YES"}

    - name: tipg
      image: ghcr.io/developmentseed/tipg:1.6.1
      args: [uvicorn, tipg.main:app, --host, 127.0.0.1, --port, "8083", --workers, "1"]
      resources: {requests: {cpu: 20m, memory: 176Mi}, limits: {memory: 320Mi}}
      env:
        - {name: POSTGRES_USER, value: eoapi}
        - {name: POSTGRES_PASS, value: generated-per-pod}
        - {name: POSTGRES_DBNAME, value: postgis}
        - {name: POSTGRES_HOST, value: localhost}
        - {name: POSTGRES_PORT, value: "5432"}
        - {name: DB_MIN_CONN_SIZE, value: "1"}
        - {name: DB_MAX_CONN_SIZE, value: "10"}
        - {name: TIPG_DB_SCHEMAS, value: '["features"]'}
        - {name: TIPG_ROOT_PATH, value: "/user/{username}/vector"}
        - {name: FORWARDED_ALLOW_IPS, value: "*"}

    - name: stac-browser  # linux/amd64 only
      image: ghcr.io/radiantearth/stac-browser:5.1.0
      volumeMounts: [{name: files, mountPath: /etc/nginx/conf.d/default.conf.template, subPath: stac_browser_conf}]
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      env:
        - {name: SB_pathPrefix, value: "/user/{username}/browser/"}
        - {name: SB_catalogUrl, value: "http://hub.spike.local:18080/user/{username}/stac/"}
        - name: SB_authConfig
          value: >-
            {{"type":"openIdConnect",
            "openIdConnectUrl":"http://hub.spike.local:18080/user/{username}/oidc/.well-known/openid-configuration",
            "oidcConfig":{{"client_id":"stac-browser","automaticSilentRenew":false}}}}

    - name: stac-manager  # linux/amd64 only; 8080 is stac-browser's in the pod
      image: ghcr.io/developmentseed/stac-manager:1.0.3
      args: [sh, -c, 'sed -i ''s/scope:"openid profile email offline_access"/scope:"openid profile email offline_access stac:write"/'' packages/client/dist/client.*.js && exec http-server -a 127.0.0.1 -p 8086 packages/client/dist']
      resources: {requests: {cpu: 10m, memory: 80Mi}, limits: {memory: 192Mi}}
      env:
        - {name: PUBLIC_URL, value: "http://hub.spike.local:18080/user/{username}/manager"}
        - {name: REACT_APP_STAC_API, value: "http://hub.spike.local:18080/user/{username}/stac"}
        - {name: REACT_APP_STAC_BROWSER, value: "http://hub.spike.local:18080/user/{username}/browser"}
        - {name: REACT_APP_OIDC_AUTHORITY, value: "http://hub.spike.local:18080/user/{username}/oidc"}
        - {name: REACT_APP_OIDC_CLIENT_ID, value: stac-manager}
        - {name: APP_TITLE, value: STAC Manager}
        - {name: APP_DESCRIPTION, value: Manage STAC collections and items in your eoAPI workshop stack}
