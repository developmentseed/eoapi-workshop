# One stack per id. Adding or removing an id restarts nobody else's pod.
participants: [u01, u02]

# printf patterns, %s = participant id. `origin` is what the browser sees
# (scheme://host[:port]); kind publishes the ingress on 127.0.0.1:18080.
host: lab-%s.spike.local
origin: http://lab-%s.spike.local:18080

# The Lab and DB images are built for amd64 and pushed by
# .github/workflows/publish-participant-images.yml as
# <registry>/eoapi-workshop-{lab,db}:sha-<commit>. Pin that tag, never :latest.
# `local` = images tagged and `kind load`ed by hand (spike/README.md).
image:
  registry: ghcr.io/developmentseed
  tag: local

# Per participant, deleted with the participant or the release.
# The DB rows (~200 MiB) and the Lab's /home/jovyan/work survive pod replacement.
storage:
  className: ""  # "" = the cluster's default StorageClass
  db: 1Gi
  work: 2Gi

# The workshop node pool: participant pods and the pre-puller land only there.
nodeSelector: {}
tolerations: []

# A DaemonSet that pulls every participant image onto each node in the pool.
prepull: false

# Pods may reach DNS and ports 80/443 on public addresses (S3, Earth Search,
# pip), never private ranges (other pods, Services, nodes). Add here any
# public address that must stay closed, e.g. the API server as a /32.
egressExcept: []

ingress:
  className: nginx
  controllerNamespace: ingress-nginx  # the only peer the NetworkPolicy admits
  tlsSecret: ""  # e.g. a pre-issued cert covering every lab-uNN host
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m  # Lab uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # kernel websockets
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

# The containers of spike/compose.participant.yml. `spec` is passed through
# verbatim; in `env`, {origin} and {user} are substituted per participant;
# `secretEnv` maps a variable to a key of <release>-credentials (<user>-<key>).
# Every container but the Lab binds 127.0.0.1 (spike/compose.participant.yml);
# probes on them must be exec, not httpGet/tcpSocket (those dial the pod IP).
# Resources: spike/evidence/footprint.md (verified: results/cold, warm, warm2). Keep
# memory values until a multi-hour soak; do not trim toward the per-run rule.
x-pg: &pg {PGHOST: localhost, PGPORT: "5432", PGUSER: eoapi, PGDATABASE: postgis}
x-pg-secret: &pgsecret {PGPASSWORD: db}

containers:
  - name: database
    sidecar: true
    spec:
      image: "{registry}/eoapi-workshop-db:{tag}"
      imagePullPolicy: IfNotPresent
      args: [postgres, -N, "100", -c, listen_addresses=127.0.0.1]
      volumeMounts: [{name: pgdata, mountPath: /var/lib/postgresql/data}]
      startupProbe:
        exec: {command: [pg_isready, -h, 127.0.0.1, -U, eoapi, -d, postgis]}
        periodSeconds: 2
        failureThreshold: 150
      resources: {requests: {cpu: 60m, memory: 560Mi}, limits: {memory: 960Mi}}
    # PGDATA one level down: a fresh block volume holds lost+found, and initdb
    # refuses a non-empty directory.
    env: {POSTGRES_USER: eoapi, POSTGRES_DB: postgis, PGUSER: eoapi, PGDATABASE: postgis, PGDATA: /var/lib/postgresql/data/pgdata}
    secretEnv: {POSTGRES_PASSWORD: db, PGPASSWORD: db}

  - name: lab
    spec:
      image: "{registry}/eoapi-workshop-lab:{tag}"
      imagePullPolicy: IfNotPresent
      ports: [{name: lab, containerPort: 18888}]
      volumeMounts: [{name: work, mountPath: /home/jovyan/work}]
      readinessProbe: {httpGet: {path: /login, port: lab}}
      resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 3Gi}}
    env:
      <<: *pg
      WORKSHOP_USER: "{user}"
      STAC_API_ENDPOINT: http://localhost:8084/stac
      TITILER_PGSTAC_API_ENDPOINT: http://localhost:8082/raster
      TIPG_API_ENDPOINT: http://localhost:8083/vector
      MOCK_OIDC_ENDPOINT: http://localhost:8085/oidc
      STAC_API_BROWSER_URL: "{origin}/stac"
      TITILER_BROWSER_URL: "{origin}/raster"
      TIPG_BROWSER_URL: "{origin}/vector"
      STAC_BROWSER_URL: "{origin}/browser"
      MOCK_OIDC_BROWSER_URL: "{origin}/oidc"
      STAC_MANAGER_URL: "{origin}/manager"
    secretEnv: {<<: *pgsecret, LAB_PASSWORD: password, LAB_TOKEN: token}

  - name: stac-fastapi
    spec:
      image: ghcr.io/stac-utils/stac-fastapi-pgstac:7.0.0
      args: [uvicorn, stac_fastapi.pgstac.app:create_app, --factory, --host, 127.0.0.1, --port, "8081", --workers, "1", --root-path, /stac]
      resources: {requests: {cpu: 30m, memory: 176Mi}, limits: {memory: 320Mi}}
    env: {<<: *pg, DB_MIN_CONN_SIZE: "1", DB_MAX_CONN_SIZE: "1", ENABLE_TRANSACTIONS_EXTENSIONS: "1", FORWARDED_ALLOW_IPS: "*"}
    secretEnv: *pgsecret

  - name: mock-oidc
    spec:
      image: ghcr.io/alukach/mock-oidc-server@sha256:5972adac0b6e3a094ea043be0f1851c65e3fd54e17a546f0b71dedd17c7a2d6a
      args: [/app/.venv/bin/uvicorn, app:app, --host, 127.0.0.1, --port, "8085", --workers, "1"]
      resources: {requests: {cpu: 10m, memory: 80Mi}, limits: {memory: 128Mi}}
    env: {ISSUER: "{origin}/oidc", PORT: "8085", SCOPES: "stac:read,stac:write", FORWARDED_ALLOW_IPS: "*"}

  - name: stac-auth-proxy
    spec:
      image: ghcr.io/developmentseed/stac-auth-proxy:v1.2.0
      args: [uvicorn, stac_auth_proxy.app:create_app, --factory, --host, 127.0.0.1, --port, "8084"]
      volumeMounts: [{name: filters, mountPath: /app/src/workshop_filters.py, subPath: workshop_filters.py}]
      resources: {requests: {cpu: 50m, memory: 224Mi}, limits: {memory: 384Mi}}
    env:
      PORT: "8084"
      ROOT_PATH: /stac
      UPSTREAM_URL: http://localhost:8081
      OIDC_DISCOVERY_URL: "{origin}/oidc/.well-known/openid-configuration"
      OIDC_DISCOVERY_INTERNAL_URL: http://localhost:8085/oidc/.well-known/openid-configuration
      DEFAULT_PUBLIC: "true"
      WAIT_FOR_UPSTREAM: "true"
      FORWARDED_ALLOW_IPS: "*"
      PRIVATE_ENDPOINTS: >-
        {"^/collections$":[["POST","stac:write"]],
        "^/collections/([^/]+)$":[["PUT","stac:write"],["PATCH","stac:write"],["DELETE","stac:write"]],
        "^/collections/([^/]+)/items$":[["POST","stac:write"]],
        "^/collections/([^/]+)/items/([^/]+)$":[["PUT","stac:write"],["PATCH","stac:write"],["DELETE","stac:write"]],
        "^/collections/([^/]+)/bulk_items$":[["POST","stac:write"]]}
      ITEMS_FILTER_CLS: workshop_filters:TenantFilter
      ITEMS_FILTER_KWARGS: '{"field":"collection"}'
      COLLECTIONS_FILTER_CLS: workshop_filters:TenantFilter
      COLLECTIONS_FILTER_KWARGS: '{"field":"id"}'

  - name: titiler-pgstac
    spec:
      image: ghcr.io/stac-utils/titiler-pgstac:3.2.0
      args: [uvicorn, titiler.pgstac.main:app, --host, 127.0.0.1, --port, "8082", --workers, "1"]
      resources: {requests: {cpu: 140m, memory: 464Mi}, limits: {memory: 768Mi}}
    env:
      <<: *pg
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "10"
      TITILER_PGSTAC_API_ROOT_PATH: /raster
      FORWARDED_ALLOW_IPS: "*"
      CPL_TMPDIR: /tmp
      GDAL_CACHEMAX: "200"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_INGESTED_BYTES_AT_OPEN: "32768"
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      GDAL_HTTP_MULTIPLEX: "YES"
      GDAL_HTTP_VERSION: "2"
      PYTHONWARNINGS: ignore
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "5000000"
      MOSAIC_CONCURRENCY: "1"
      TITILER_PGSTAC_API_ENABLE_EXTERNAL_DATASET_ENDPOINTS: "True"
      AWS_NO_SIGN_REQUEST: "YES"
    secretEnv: *pgsecret

  - name: tipg
    spec:
      image: ghcr.io/developmentseed/tipg:1.6.1
      args: [uvicorn, tipg.main:app, --host, 127.0.0.1, --port, "8083", --workers, "1"]
      resources: {requests: {cpu: 20m, memory: 176Mi}, limits: {memory: 320Mi}}
    env:
      POSTGRES_USER: eoapi
      POSTGRES_DBNAME: postgis
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DB_MIN_CONN_SIZE: "1"
      DB_MAX_CONN_SIZE: "10"
      TIPG_DB_SCHEMAS: '["features"]'
      TIPG_ROOT_PATH: /vector
      FORWARDED_ALLOW_IPS: "*"
    secretEnv: {POSTGRES_PASS: db}

  - name: stac-browser  # linux/amd64 only
    spec:
      image: ghcr.io/radiantearth/stac-browser:5.1.0
      volumeMounts: [{name: filters, mountPath: /etc/nginx/conf.d/default.conf.template, subPath: stac-browser.conf.template}]
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
    env:
      SB_pathPrefix: /browser/
      SB_catalogUrl: "{origin}/stac/"
      SB_authConfig: >-
        {"type":"openIdConnect",
        "openIdConnectUrl":"{origin}/oidc/.well-known/openid-configuration",
        "oidcConfig":{"client_id":"stac-browser","automaticSilentRenew":false}}

  - name: stac-manager  # linux/amd64 only; 8080 is stac-browser's in the pod
    spec:
      image: ghcr.io/developmentseed/stac-manager:1.0.3
      # adds stac:write to the hard-coded OIDC scope (compose has the why)
      args: [sh, -c, 'sed -i ''s/scope:"openid profile email offline_access"/scope:"openid profile email offline_access stac:write"/'' packages/client/dist/client.*.js && exec http-server -a 127.0.0.1 -p 8086 packages/client/dist']
      resources: {requests: {cpu: 10m, memory: 80Mi}, limits: {memory: 192Mi}}
    env:
      PUBLIC_URL: "{origin}/manager"
      REACT_APP_STAC_API: "{origin}/stac"
      REACT_APP_STAC_BROWSER: "{origin}/browser"
      REACT_APP_OIDC_AUTHORITY: "{origin}/oidc"
      REACT_APP_OIDC_CLIENT_ID: stac-manager
      APP_TITLE: STAC Manager
      APP_DESCRIPTION: Manage STAC collections and items in your eoAPI workshop stack
