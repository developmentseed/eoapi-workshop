{{/*
Row-level authorization filters for stac-auth-proxy (chapter 7), mounted at
/app/src/workshop_filters.py via eoapi.stac-auth-proxy.extraVolumes.
files/workshop_filters.py symlinks docs/workshop_filters.py, which
docker-compose mounts too, so both deployments run the same policy.
*/}}
{{- $sap := index .Values.eoapi "stac-auth-proxy" -}}
{{- if and $sap $sap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-filters
data:
  workshop_filters.py: |-
{{ .Files.Get "files/workshop_filters.py" | indent 4 }}
{{- end }}
