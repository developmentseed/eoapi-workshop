version: 1
project:
  id: eoapi-workshop
  title: eoAPI Workshop
  github: https://github.com/developmentseed/eoapi-workshop
  thebe:
    binder:
      url: https://binder.opensci.2i2c.cloud
      repo: developmentseed/eoapi-workshop
      ref: main
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        # the docker-compose services aren't up during a docs build
        - http://localhost:8080
        - http://localhost:8081
        - http://localhost:8082
        - http://localhost:8083
        - http://localhost:8084
        - http://localhost:8085
        - http://localhost:8086
        - http://localhost:8888
  toc:
    - file: docs/00-introduction.ipynb
    - file: docs/01-stac_metadata.ipynb
    - file: docs/02-database.ipynb
    - file: docs/03-stac_fastapi_pgstac.ipynb
    - file: docs/04-titiler_pgstac.ipynb
    - file: docs/05-tipg.ipynb
site:
  template: book-theme
  options:
    style: ./docs/jupyterbook.css
    logo_text: eoAPI Workshop
    favicon: docs/media/eoAPI.png
