[project]
name = "eoapi-workshop"
version = "0.1.0"
description = "materials for the eoAPI workshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
deploy = [
    "eoapi-cdk==10.3.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
]
dev = [
    "jupyterlab>=4.4.0",
    "pre-commit>=4.2.0",
    "ruff>=0.11.5",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
# fragments: checks/auth/run.sh pipes `cat common.py <file>` into one python process
"spike/checks/auth/{inpod,laptop,offpod}.py" = ["F821"]
