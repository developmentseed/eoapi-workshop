name: Publish participant images

# Builds the per-participant Lab and DB images (participant/lab, participant/db) for amd64
# and pushes them to GHCR as eoapi-workshop-{lab,db}:sha-<commit>, the tag that
# participant/chart pins (image.tag, participant/deploy.sh TAG). Pull requests only build.
# A private package needs a pull secret on the namespace's default
# ServiceAccount, created by hand: participant/deploy.sh does not create one.
on:
  push:
    branches: [main, feat/k8s]
    paths:
      - Dockerfile.local
      - environment.yml
      - docs/**
      - participant/lab/**
      - participant/db/**
      - .github/workflows/publish-participant-images.yml
  pull_request:
    paths:
      - Dockerfile.local
      - environment.yml
      - docs/**
      - participant/lab/**
      - participant/db/**
      - .github/workflows/publish-participant-images.yml
  workflow_dispatch: {}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REG: ghcr.io/${{ github.repository_owner }}
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build
        run: |
          docker build -f Dockerfile.local -t eoapi-participant-lab-base .
          docker build -t "$REG/eoapi-workshop-lab:$TAG" participant/lab
          docker build -t "$REG/eoapi-workshop-db:$TAG" participant/db
      - name: Push
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$REG/eoapi-workshop-lab:$TAG"
          docker push "$REG/eoapi-workshop-db:$TAG"
          echo "image.tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
