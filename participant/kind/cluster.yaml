# Local stand-in for "labs": one node, ingress-nginx on host port 18080.
#   kind create cluster --name eoapi-participant --config participant/kind/cluster.yaml \
#     --kubeconfig participant/.kind-kubeconfig
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        listenAddress: 127.0.0.1
